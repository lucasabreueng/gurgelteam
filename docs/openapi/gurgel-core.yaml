openapi: 3.0.3
info:
  title: Gurgel Team API
  version: 1.0.0
  description: |
    Contrato HTTP núcleo — Fase 4 (v1 completo — Fase 4).
    Schemas Zod canônicos em `lib/contracts/api/v1/`.
servers:
  - url: /api/v1
    description: Next.js API routes (alvo Fase 5)
  - url: https://api.gurgelteam.com.br/v1
    description: Produção (futuro)

tags:
  - name: Auth
  - name: Schedule
  - name: Lessons
  - name: Clients
  - name: Karts
  - name: Maintenance
  - name: Inventory
  - name: Finance
  - name: Telemetry
  - name: Reports
  - name: Settings
  - name: Pilot
  - name: Audit

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sessionCookie:
      type: apiKey
      in: cookie
      name: session

  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - BUSINESS_RULE
            - RATE_LIMITED
            - SERVICE_UNAVAILABLE
            - INTERNAL_ERROR
        message:
          type: string
        httpStatus:
          type: integer
        details:
          type: object

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: "#/components/schemas/ApiError"
        message:
          type: string

    LoginRequest:
      type: object
      required: [identifier, password, remember]
      properties:
        identifier:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 1
        remember:
          type: boolean

    AuthUser:
      type: object
      required: [id, email, username, firstName, lastName, roleKey, active]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        roleKey:
          type: string
          enum: [admin, recepcao, financeiro, mecanico]
        clientId:
          type: string
          format: uuid
          nullable: true
        active:
          type: boolean

    LoginResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [user, accessToken, expiresIn]
          properties:
            user:
              $ref: "#/components/schemas/AuthUser"
            accessToken:
              type: string
            expiresIn:
              type: integer

    ScheduleEvent:
      type: object
      required: [id, startsAt, endsAt, type, status]
      properties:
        id:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        type:
          type: string
        status:
          type: string
        clientId:
          type: string
          format: uuid
          nullable: true
        registeredById:
          type: string
          format: uuid
          nullable: true
        registeredByName:
          type: string
          nullable: true
        kartId:
          type: string
          format: uuid
          nullable: true

    CreateScheduleEvent:
      type: object
      required: [startsAt, endsAt, type]
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        type:
          type: string
        clientId:
          type: string
          format: uuid
        kartId:
          type: string
          format: uuid

    ScheduleEventsResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleEvent"

    LessonSession:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        scheduleEventId:
          type: string
          format: uuid
          nullable: true
        clientId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
        registeredById:
          type: string
          format: uuid
          nullable: true
        registeredByName:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    LessonRegistration:
      type: object
      required: [sessionId, laps, notes, method]
      properties:
        sessionId:
          type: string
          format: uuid
        method:
          type: string
          enum: [ocr, telemetry, manual]
        telemetrySessionId:
          type: string
          format: uuid
        laps:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              lap:
                type: integer
              s1:
                type: string
              s2:
                type: string
              s3:
                type: string
              total:
                type: string
        notes:
          type: object
          properties:
            positives:
              type: string
            improvements:
              type: string
            recommendations:
              type: string
            general:
              type: string

    AccountReceivable:
      type: object
      required: [id, clientId, amountCents, dueDate, status, serviceLabel]
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        amountCents:
          type: integer
          minimum: 0
        dueDate:
          type: string
          format: date
        status:
          type: string
          enum: [pago, pendente, vencido, parcial]
        serviceLabel:
          type: string

    RecordPayment:
      type: object
      required: [receivableId, amountCents, paidAt, method]
      properties:
        receivableId:
          type: string
          format: uuid
        amountCents:
          type: integer
        paidAt:
          type: string
          format: date-time
        method:
          type: string

    CreateReportRun:
      type: object
      required: [definitionId, periodFrom, periodTo, exportFormat]
      properties:
        definitionId:
          type: string
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
        exportFormat:
          type: string
          enum: [pdf, xlsx, csv]

    ReportRun:
      type: object
      required: [id, definitionId, status, exportFormat]
      properties:
        id:
          type: string
          format: uuid
        definitionId:
          type: string
        domain:
          type: string
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
        exportFormat:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        fileUrl:
          type: string
          format: uri
          nullable: true

    PresignedUpload:
      type: object
      required: [sessionId, uploadUrl, uploadMethod, expiresAt, storageKey]
      properties:
        sessionId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
        uploadMethod:
          type: string
          enum: [PUT]
        expiresAt:
          type: string
          format: date-time
        storageKey:
          type: string

paths:
  # --- §2 Auth ---
  /auth/login:
    post:
      tags: [Auth]
      summary: Login com email ou username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Encerrar sessão
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: OK
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/session:
    get:
      tags: [Auth]
      summary: Sessão atual
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: OK
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      tags: [Auth]
      summary: Cadastro de usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Usuário criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/AuthUser"
        "403":
          description: Regra BR-AUTH-MINOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password-recovery:
    post:
      tags: [Auth]
      summary: Solicitar recuperação de senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: E-mail enviado

  /auth/password-recovery/verify:
    post:
      tags: [Auth]
      summary: Verificar código de recuperação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Token de reset
        "401":
          description: Código inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password-recovery/reset:
    post:
      tags: [Auth]
      summary: Redefinir senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Senha alterada
        "401":
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # --- §3 Clients ---
  /clients:
    get:
      tags: [Clients]
      summary: Listar clientes
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Clients]
      summary: Criar cliente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Cliente criado
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clients/{clientId}:
    get:
      tags: [Clients]
      summary: Perfil completo do cliente
      security:
        - bearerAuth: []
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Clients]
      summary: Atualizar cliente
      security:
        - bearerAuth: []
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clients/{clientId}/guardians:
    post:
      tags: [Clients]
      summary: Vincular responsável
      security:
        - bearerAuth: []
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clients/{clientId}/stats:
    get:
      tags: [Clients]
      summary: Estatísticas do piloto
      security:
        - bearerAuth: []
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK

  /clients/{clientId}/timeline:
    get:
      tags: [Clients]
      summary: Timeline de eventos do cliente
      security:
        - bearerAuth: []
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # --- §4 Schedule ---
  /schedule/meta:
    get:
      tags: [Schedule]
      summary: KPIs e filtros operacionais
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /schedule/events:
    get:
      tags: [Schedule]
      summary: Listar eventos da agenda
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleEventsResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Schedule]
      summary: Criar evento
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleEvent"
      responses:
        "201":
          description: Criado
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflito de horário/kart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /schedule/events/{eventId}:
    get:
      tags: [Schedule]
      summary: Detalhe do evento
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Schedule]
      summary: Atualizar evento
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /schedule/events/{eventId}/cancel:
    post:
      tags: [Schedule]
      summary: Cancelar evento
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: OK
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /schedule/events/{eventId}/reschedule:
    post:
      tags: [Schedule]
      summary: Reagendar evento
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /schedule/events/{eventId}/swap-kart:
    post:
      tags: [Schedule]
      summary: Trocar kart do evento
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /schedule/upcoming-days:
    get:
      tags: [Schedule]
      summary: Resumo por dia
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: days
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /schedule/blocks:
    get:
      tags: [Schedule]
      summary: Listar bloqueios de agenda
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Schedule]
      summary: Criar bloqueio de agenda
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Criado
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /schedule/blocks/{blockId}:
    delete:
      tags: [Schedule]
      summary: Remover bloqueio de agenda
      security:
        - bearerAuth: []
      parameters:
        - name: blockId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # --- §5 Lessons ---
  /lessons/sessions:
    get:
      tags: [Lessons]
      summary: Listar sessões de aula
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LessonSession"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lessons/sessions/{sessionId}:
    get:
      tags: [Lessons]
      summary: Detalhe da sessão de aula
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/LessonSession"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lessons/sessions/{sessionId}/start:
    post:
      tags: [Lessons]
